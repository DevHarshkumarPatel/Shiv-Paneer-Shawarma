<!doctype html>
<html lang="en-IN">
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="robots" content="noindex, nofollow" />
<title>Edit log — Shiv Paneer Shawarma Staff</title>
<link rel="icon" href="/favicon.ico" sizes="48x48" />
<link rel="icon" type="image/png" sizes="96x96" href="/assets/img/icon-96.png" />
<link rel="stylesheet" href="../assets/css/tokens.css" />
<link rel="stylesheet" href="../assets/css/base.css" />
<link rel="stylesheet" href="../assets/css/components.css" />
<link rel="stylesheet" href="../assets/css/staff.css" />
<body class="staff-body">

<header class="staff-header">
  <div class="container">
    <a class="brand" href="orders.html">
      <img src="../assets/img/logo.jpeg" alt="logo" style="height:34px;width:34px;border-radius:8px;background:#fff;padding:2px;" />
      <div class="name">Shiv Paneer Shawarma</div>
    </a>
    <nav class="nav">
      <a href="orders.html">Orders</a>
      <a href="new-order.html">New order</a>
      <a href="customers.html">Customers</a>
      <a href="reviews.html">Reviews</a>
      <a href="order-edits.html" class="active">Edit log</a>
      <a href="menu-admin.html">Menu &amp; Offers</a>
    </nav>
    <div class="who">
      <span id="whoami"></span>
      <button class="btn btn-ghost btn-sm" id="logoutBtn" style="border-color:rgba(255,255,255,.4);">Logout</button>
    </div>
  </div>
</header>

<main>
  <div class="container">
    <div class="board-toolbar">
      <strong>Edit log</strong>
      <div class="date-field">
        <label for="dateFilter" title="Show the changes made on this date">📅 <input type="date" id="dateFilter" /></label>
        <button class="btn btn-ghost btn-sm" id="todayBtn">Today</button>
        <button class="btn btn-ghost btn-sm" id="allDatesBtn">All dates</button>
      </div>
      <button class="btn btn-outline btn-sm" id="refreshBtn">↻ Refresh</button>
      <span class="text-sm text-muted" id="lastUpdated"></span>
      <span class="spacer"></span>
      <label class="text-sm" title="Only the changes that moved the bill">
        <input type="checkbox" id="moneyOnly" /> Money changes only
      </label>
    </div>
    <p class="text-sm text-muted" style="margin:0 0 var(--sp-3);">
      Every change made to an order after it was placed — what moved, who moved it,
      and when in IST. Nothing here can be edited or removed.
    </p>
    <div id="editLog"><div class="center-load"><div class="spinner"></div><div>Loading the log…</div></div></div>
  </div>
</main>

<script src="../js/config.js"></script>
<script src="../js/api.js"></script>
<script src="../js/ui.js"></script>
<script src="../js/staff/auth.js"></script>
<script src="../js/staff/order-edits.js"></script>
