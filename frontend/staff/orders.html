<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Orders — Shiv Paneer Shawarma Staff</title>
<link rel="icon" href="../assets/img/logo.jpeg" />
<link rel="stylesheet" href="../assets/css/tokens.css" />
<link rel="stylesheet" href="../assets/css/base.css" />
<link rel="stylesheet" href="../assets/css/components.css" />
<link rel="stylesheet" href="../assets/css/staff.css" />
<body class="staff-body">

<header class="staff-header">
  <div class="container">
    <a class="brand" href="orders.html">
      <img src="../assets/img/logo.jpeg" alt="logo" style="height:34px;width:34px;border-radius:8px;background:#fff;padding:2px;" />
      <div class="name">Shiv Paneer Shawarma</div>
    </a>
    <nav class="nav">
      <a href="orders.html" class="active">Orders</a>
      <a href="menu-admin.html" id="navMenu" class="hidden">Menu &amp; Offers</a>
    </nav>
    <div class="who">
      <span id="whoami"></span>
      <button class="btn btn-ghost btn-sm" id="logoutBtn" style="border-color:rgba(255,255,255,.4);">Logout</button>
    </div>
  </div>
</header>

<main>
  <div class="container">
    <div class="board-toolbar">
      <strong>Orders</strong>
      <button class="btn btn-outline btn-sm" id="refreshBtn">↻ Refresh</button>
      <span class="text-sm text-muted" id="lastUpdated"></span>
      <span class="spacer"></span>
      <div class="chips" style="padding:0;overflow:visible;">
        <button class="chip active" data-filter="all">All</button>
        <button class="chip" data-filter="dine_in">🍽️ Dine-in</button>
        <button class="chip" data-filter="takeaway">🥡 Takeaway</button>
        <button class="chip" data-filter="delivery">🛵 Delivery</button>
      </div>
      <label class="text-sm" style="display:flex;align-items:center;gap:6px;"><input type="checkbox" id="activeOnly" checked /> Active only</label>
    </div>
    <div id="ordersBoard"><div class="center-load"><div class="spinner"></div><div>Loading orders…</div></div></div>
  </div>
</main>

<script src="../js/config.js"></script>
<script src="../js/api.js"></script>
<script src="../js/ui.js"></script>
<script src="../js/staff/auth.js"></script>
<script src="../js/staff/orders.js"></script>
