<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Staff Login — Shiv Paneer Shawarma</title>
<link rel="icon" href="../assets/img/logo.jpeg" />
<link rel="stylesheet" href="../assets/css/tokens.css" />
<link rel="stylesheet" href="../assets/css/base.css" />
<link rel="stylesheet" href="../assets/css/components.css" />
<link rel="stylesheet" href="../assets/css/staff.css" />

<div class="login-wrap">
  <div class="card login-card">
    <div class="card-pad">
      <img class="logo" src="../assets/img/logo.jpeg" alt="Shiv Paneer Shawarma" />
      <h2 class="text-center" style="margin-bottom:4px;">Staff &amp; Owner</h2>
      <p class="text-center text-muted text-sm" style="margin-bottom:var(--sp-4);">Sign in to manage orders and the menu.</p>
      <form id="loginForm">
        <div class="field"><label>Email</label><input class="input" id="email" type="email" autocomplete="username" required /></div>
        <div class="field"><label>Password</label><input class="input" id="password" type="password" autocomplete="current-password" required /></div>
        <div id="loginErr" class="text-sm" style="color:var(--err);min-height:18px;margin-bottom:8px;"></div>
        <button class="btn btn-primary btn-block btn-lg" id="loginBtn" type="submit">Sign in</button>
      </form>
      <p class="text-center text-sm text-muted" style="margin-top:var(--sp-4);"><a href="../index.html">← Back to website</a></p>
    </div>
  </div>
</div>

<script src="../js/config.js"></script>
<script src="../js/api.js"></script>
<script src="../js/staff/auth.js"></script>
<script>
  document.addEventListener("DOMContentLoaded", () => {
    Auth.redirectIfAuthed("orders.html");
    const form = document.getElementById("loginForm");
    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      const btn = document.getElementById("loginBtn");
      const err = document.getElementById("loginErr");
      err.textContent = ""; btn.disabled = true; btn.textContent = "Signing in…";
      try {
        await Auth.login(document.getElementById("email").value.trim(), document.getElementById("password").value);
        location.href = "orders.html";
      } catch (ex) {
        err.textContent = ex.message || "Login failed";
        btn.disabled = false; btn.textContent = "Sign in";
      }
    });
  });
</script>
